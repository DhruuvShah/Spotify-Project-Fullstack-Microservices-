  <circle cx="18" cy="18" r="18" fill="#c84b31"/>
  <!-- Subtle inner ring for depth -->
  <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
